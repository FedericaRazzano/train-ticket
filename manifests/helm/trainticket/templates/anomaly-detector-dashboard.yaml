{{- if .Values.anomalyScanner.monitoring }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-anomaly-detector
  labels:
    grafana_dashboard: "1"
data:
  ai-anomaly-detector.json: |
    {
      "title": "AI Anomaly Detector",
      "uid": "ai-anomaly-detector",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Total Scans",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "targets": [
            {
              "expr": "ai_anomaly_scans_total",
              "legendFormat": "scans",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "title": "Anomalies Found (last scan)",
          "type": "stat",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "targets": [
            {
              "expr": "ai_anomaly_anomalies_found",
              "legendFormat": "anomalies",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "thresholds": {
              "mode": "absolute",
              "steps": [
                { "color": "green", "value": null },
                { "color": "red",   "value": 1 }
              ]
            }
          }
        },
        {
          "id": 3,
          "title": "Anomalies Over Time",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "ai_anomaly_anomalies_found",
              "legendFormat": "anomalies found",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red",   "value": 1 }
                ]
              },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "id": 4,
          "title": "Service Anomaly Scores",
          "type": "bargauge",
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 10 },
          "targets": [
            {
              "expr": "ai_anomaly_service_score",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 0.4 },
                  { "color": "red",    "value": 0.7 }
                ]
              }
            }
          }
        }
      ]
    }
{{- end }}
